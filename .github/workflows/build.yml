name: Build and release

# Push a tag like v1.2.0 to publish a GitHub Release. StreamDeck Host checks the latest release on start-up and
# updates itself from the "StreamDeckHost.exe" asset; the phone UI is served by the PC, so it updates too.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build host + installer
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-host
          path: dist/*

  android-apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
      - name: Prepare Flutter project
        shell: pwsh
        run: ./build-android.ps1 -SetupOnly
      - name: Analyze and test
        shell: pwsh
        working-directory: mobile
        run: |
          flutter pub get
          dart analyze lib test
          flutter test
      - name: Build APK
        shell: pwsh
        run: ./build-android.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/StreamDeck-Mobile.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-host, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
