    m.classList.toggle('on', !!discord.mute); m.lastChild.textContent = discord.mute ? 'Unmute' : 'Mute';
    d.classList.toggle('on', !!discord.deaf); d.lastChild.textContent = discord.deaf ? 'Undeafen' : 'Deafen';
    w.querySelector('.leave').style.opacity = discord.inCall ? 1 : .4;
    // --- servers view

      const key = JSON.stringify([view, discord.rpc, dGuilds, dGuild && dGuild.id, dChannels]);
      if (w._k !== key) {
        w._k = key;
        const msg = w.querySelector('.dsrv .dmsg'), grid = w.querySelector('.dgrid');
        msg.textContent = discord.rpc !== 'ok' ? (discord.status || 'Discord is not connected') : (!dGuilds || dGuilds.loading ? 'Loading your servers…' : (dGuilds.error ? 'Could not load servers: ' + dGuilds.error : (dGuilds.list.length ? 'Tap a server to see its voice channels' : 'No servers found')));
        grid.innerHTML = '';
        ((dGuilds && dGuilds.list) || []).forEach(g => {
          const t = document.createElement('div'); t.className = 'gt'; t.dataset.l = (g.name || '?').trim().charAt(0).toUpperCase();
          const im = document.createElement('img'); if (g.icon) { im.src = g.icon; im.onerror = () => { im.remove(); t.classList.add('noimg'); }; t.append(im); } else t.classList.add('noimg');
          const nm = document.createElement('div'); nm.className = 'gn'; nm.textContent = g.name; t.append(nm);
          t.addEventListener('click', () => { native('h'); dOpenGuild(g); });
          grid.append(t);
        });
        const cm = w.querySelector('.dchn .dmsg'), list = w.querySelector('.dlist');
        cm.textContent = dGuild ? dGuild.name + (!dChannels || dChannels.loading ? ' - loading…' : (dChannels.error ? ' - ' + dChannels.error : (dChannels.list.length ? ' - tap a voice channel to join' : ' - no voice channels'))) : '';
        list.innerHTML = '';
        ((dChannels && dChannels.list) || []).forEach(c => { const r = document.createElement('div'); r.className = 'dc'; r.textContent = '🔊  ' + c.name; r.addEventListener('click', () => dJoin(c)); list.append(r); });
      }
    }
  });
}/** Jump to the Discord page when a call starts; go back when it ends. Swiping away during a call is respected. */
function autoDiscordPage() {
  if (PREVIEW) return;
  if (folderId) { if (discord.inCall) { /* keep the folder; the user is busy */ } return; }
  const idx = shownPages.findIndex(p => p.kind === 'discord' && p.autoOpen !== false);
  if (idx < 0) return;
  const host = $('pages');
  if (discord.inCall && !autoOpened && !dismissedCall) {
    autoOpened = true; prevPage = curPage;
    if (curPage !== idx) { curPage = idx; host.scrollTo({ left: idx * host.clientWidth }); markDots(); activate(); }
  } else if (!discord.inCall) {
    if (autoOpened) { autoOpened = false; const back = Math.min(prevPage, shownPages.length - 1); if (curPage === idx && back !== idx) { curPage = back; host.scrollTo({ left: back * host.clientWidth }); markDots(); activate(); } }
    dismissedCall = false;
  }
}

function ytEmbed(u) {
  u = u.trim(); if (!u) return 'about:blank';
  const p = '&autoplay=1&playsinline=1&rel=0&modestbranding=1';
  let m = u.match(/[?&]list=([\w-]+)/), v = u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  if (v) return `https://www.youtube.com/embed/${v[1]}?${m ? 'list=' + m[1] : ''}${p}`;
  if (m) return `https://www.youtube.com/embed/videoseries?list=${m[1]}${p}`;
  if (/^[\w-]{11}$/.test(u)) return `https://www.youtube.com/embed/${u}?${p.slice(1)}`;
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}
function onFrame(blob) {
  const img = document.querySelector('img.scrw'); if (!img) return;
  const url = URL.createObjectURL(blob); const old = frameUrl; frameUrl = url; img.src = url; if (old) URL.revokeObjectURL(old);
  const m = $('scrMsg'); if (m) m.remove();
}
function bindScreenTouch(img) {
  const pos = e => {
    const r = img.getBoundingClientRect(), ar = (img.naturalWidth || 16) / (img.naturalHeight || 9);
    let w = r.width, h = r.width / ar; if (h > r.height) { h = r.height; w = h * ar; }
    const l = r.left + (r.width - w) / 2, t = r.top + (r.height - h) / 2;
    return { x: (e.clientX - l) / w, y: (e.clientY - t) / h };
  };
  let st = null;
  img.addEventListener('pointerdown', e => {
    st = { x: e.clientX, y: e.clientY, drag: false, long: false, p: pos(e), moved: 0 };
    st.timer = setTimeout(() => { if (st && !st.drag) { st.long = true; native('h'); send({ t: 'pointer', kind: 'rclick', ...st.p }); } }, 600);
    try { img.setPointerCapture(e.pointerId); } catch (x) {}
  });
  img.addEventListener('pointermove', e => {
    if (!st || st.long) return;
    if (!st.drag && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 10) { st.drag = true; clearTimeout(st.timer); send({ t: 'pointer', kind: 'down', ...st.p }); }
    if (st.drag) { const n = Date.now(); if (n - (st.last || 0) > 40) { st.last = n; send({ t: 'pointer', kind: 'move', ...pos(e) }); } }
  });
  const end = e => {
    if (!st) return; clearTimeout(st.timer);
    if (st.drag) send({ t: 'pointer', kind: 'up', ...pos(e) });
    else if (!st.long && e.type === 'pointerup') { native('h'); send({ t: 'pointer', kind: 'click', ...st.p }); }
    st = null;
  };
  img.addEventListener('pointerup', end); img.addEventListener('pointercancel', end);
}
function lyricTick() {
  const w = document.querySelector('.lyw'); if (!w) return;
  const h = w.querySelector('.h'), box = w.querySelector('.L > div'), L = w.querySelector('.L');
  if (!med || med.none) { h.innerHTML = '<b>Nothing playing</b><span>Play a song on the PC (Spotify, YouTube Music, …)</span>'; box.innerHTML = ''; lyr = { key: '', lines: [] }; return; }
  const key = med.key;
  if (h.dataset.k !== key) { h.dataset.k = key; h.innerHTML = ''; const b = document.createElement('b'), s = document.createElement('span'); b.textContent = med.title; s.textContent = med.artist; h.append(b, s); }
  if (box.dataset.k !== lyr.key) {
    box.dataset.k = lyr.key; box.innerHTML = ''; lyIdx = -1;
    if (!lyr.lines.length) { const p = document.createElement('p'); p.className = 'on'; p.textContent = lyr.key === key ? 'No lyrics found for this song' : 'Loading lyrics…'; p.style.opacity = .6; box.append(p); }
    else lyr.lines.forEach(l => { const p = document.createElement('p'); p.textContent = l.l || '♪'; box.append(p); });
  }
  if (!lyr.lines.length || lyr.key !== key) return;
  const now = med.pos + (med.playing ? (Date.now() - med.at) / 1000 : 0);
  let i = -1; for (let j = 0; j < lyr.lines.length; j++) { if (lyr.lines[j].t <= now + 0.25) i = j; else break; }
  if (i !== lyIdx) {
    lyIdx = i; [...box.children].forEach((p, j) => p.classList.toggle('on', j === i));
    const p = box.children[Math.max(0, i)]; if (p) box.style.transform = `translateY(${L.clientHeight / 2 - p.offsetTop - p.offsetHeight / 2}px)`;
  }
}
setInterval(lyricTick, 250);

function keyEl(b) {
  const k = document.createElement('div'); k.className = 'key'; k._b = b;
  const fa = b.fillAlpha != null ? b.fillAlpha : (layout && layout.keyAlpha != null ? layout.keyAlpha : 0.55);
  k.style.setProperty('--fill', hexToRgba(b.fill || '#000000', fa));
  const blur = (layout && layout.keyBlur) || 0;
  if (blur) { k.style.backdropFilter = `blur(${blur}px)`; k.style.webkitBackdropFilter = `blur(${blur}px)`; }
  k.style.setProperty('--bc', hexToRgba(b.color1, .75)); k.style.setProperty('--ic', `color-mix(in srgb, ${b.color1} 70%, white)`);
  k.style.setProperty('--c1', b.color1); k.style.setProperty('--c2', b.color2); k.style.setProperty('--t1', hexToRgba(b.color1, .3));
  k.style.setProperty('--gl', Math.round(4 + 22 * b.glow) + 'px'); k.style.setProperty('--ga', hexToRgba(b.color1, .15 + .45 * b.glow));
  if (b.widget && b.widget.startsWith('slider:')) { makeSlider(k, b); }
  else if (b.widget) {
    k.dataset.w = b.widget;
    k.innerHTML = '<div class="val"></div><div class="bar"><i></i></div>';
  } else if (b.image) { const i = document.createElement('img'); i.src = b.image; k.append(i); }
  else {
    const ic = document.createElement('div'); ic.className = 'ic';
    if ((b.icon || '').startsWith('t:')) { ic.classList.add('txt'); ic.textContent = b.icon.slice(2); }
    else ic.textContent = icons[b.icon] ? String.fromCodePoint(icons[b.icon]) : (icons.bolt ? String.fromCodePoint(icons.bolt) : '?');
    k.append(ic);
  }
  if (b.label && !b.hideLabel && layout && layout.showLabels === true) { const lb = document.createElement('div'); lb.className = 'lb'; lb.textContent = b.label; k.append(lb); }
  else k.classList.add('nolabel');
  k.addEventListener('pointerdown', () => k.classList.add('down'));
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(e => k.addEventListener(e, () => k.classList.remove('down')));
  if (!k.classList.contains('slider')) k.addEventListener('click', () => press(k, b));
  return k;
}

// ---- sliders (volume / brightness): drag inside the key, like a phone's control panel ------------
const SLIDERS = { volume: { type: 'volume_set', icon: 'volume_up', get: s => s.volume }, brightness: { type: 'brightness_set', icon: 'wb_sunny', get: s => s.brightness } };
function paintSlider(k, pct) {
  const f = k.querySelector('.fill'), v = k.querySelector('.sval');
  const vertical = k.clientHeight >= k.clientWidth, p = Math.max(0, Math.min(100, pct == null ? 0 : pct));
  if (vertical) { f.style.width = '100%'; f.style.height = p + '%'; f.style.left = '0'; f.style.bottom = '0'; f.style.background = 'linear-gradient(0deg,var(--ic),color-mix(in srgb,var(--ic) 35%,transparent))'; }
  else { f.style.height = '100%'; f.style.width = p + '%'; f.style.left = '0'; f.style.bottom = '0'; f.style.background = 'linear-gradient(90deg,var(--ic),color-mix(in srgb,var(--ic) 35%,transparent))'; }
  v.textContent = pct == null || pct < 0 ? 'n/a' : p + '%';
}
function makeSlider(k, b) {
  const kind = b.widget.slice(7), sd = SLIDERS[kind] || SLIDERS.volume;
  k.classList.add('slider'); k.dataset.sl = kind; k.style.touchAction = 'none';
  const fill = document.createElement('div'); fill.className = 'fill';
  const ic = document.createElement('div'); ic.className = 'ic';
  const name = b.icon && !b.icon.startsWith('t:') && icons[b.icon] ? b.icon : sd.icon;
  ic.textContent = icons[name] ? String.fromCodePoint(icons[name]) : '';
  const val = document.createElement('div'); val.className = 'sval';
  if (b.hideLabel || !(layout && layout.showLabels === true)) val.style.display = 'none';
  k.append(fill, ic, val);
  let dragging = false, lastSend = 0, pct = 0;
  const send1 = v => send({ t: 'action', id: nextId++, action: { type: sd.type, value: v } });
  const upd = e => {
    const r = k.getBoundingClientRect(), vertical = k.clientHeight >= k.clientWidth;
    let v = vertical ? 1 - (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    pct = Math.round(Math.max(0, Math.min(1, v)) * 100); paintSlider(k, pct);
    const now = Date.now(); if (now - lastSend > 120) { lastSend = now; send1(pct); }
  };
  k.addEventListener('pointerdown', e => { if (!connected) { toast('Not connected to the PC'); return; } dragging = true; k._drag = true; try { k.setPointerCapture(e.pointerId); } catch (x) {} native('h'); upd(e); });
  k.addEventListener('pointermove', e => { if (dragging) upd(e); });
  const end = () => { if (!dragging) return; dragging = false; send1(pct); setTimeout(() => { k._drag = false; }, 800); };
  k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
  k._slider = sd; paintSlider(k, null);
}
function refreshSliders() {
  document.querySelectorAll('.key.slider').forEach(k => { if (k._drag || !connected) return; paintSlider(k, k._slider.get(status)); });
}

function refreshActive() {
  document.querySelectorAll('.key').forEach(k => {
    const t = k._b && k._b.action && k._b.action.type;
    k.classList.toggle('act', (t === 'mute_toggle' && status.muted === true) || (t === 'mic_toggle' && status.micMuted === true) || (t === 'discord_mute_toggle' && discord.mute) || (t === 'discord_deafen_toggle' && discord.deaf) || (t === 'obs_stream_toggle' && obs.streaming) || (t === 'obs_record_toggle' && obs.recording) || (t === 'obs_virtualcam_toggle' && obs.vcam) || (t === 'obs_scene' && obs.scene && k._b.action.scene === obs.scene) || (t === 'obs_studio_toggle' && obs.studio) || (t === 'obs_replay_toggle' && obs.replay) || (t === 'obs_mute_toggle' && (obs.inputs.find(i => i.name === k._b.action.input) || {}).mute === true));
  });
}
function markDots() { [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === curPage)); }
$('pages').addEventListener('scroll', () => {
  const h = $('pages'); const i = Math.round(h.scrollLeft / Math.max(1, h.clientWidth));
  if (i !== curPage) { curPage = i; if (autoOpened && shownPages[i] && shownPages[i].kind !== 'discord') { autoOpened = false; dismissedCall = true; } markDots(); activate(); const d = $('dots'); d.classList.add('show'); clearTimeout(dotsT); dotsT = setTimeout(() => d.classList.remove('show'), 1200); }
}, { passive: true });

const send = o => { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; };

function press(k, b) {
  native('h');
  const at = b.action && b.action.type;
  if (at === 'folder') { folderId = b.action.pageId || null; curPage = 0; render(); return; }
  if (at === 'back') { folderId = null; curPage = 0; render(); return; }
  if (PREVIEW) return;
  if (!b.action || b.action.type === 'none') return;
  if (!connected) { toast('Not connected to the PC'); return; }
  const run = () => {
    const id = nextId++;
    k.classList.add('busy'); setTimeout(() => k.classList.remove('busy'), 450);
    pending[id] = r => { if (!r.ok) toast(r.error || 'Failed'); else if (r.message) toast(r.message, true); };
    send({ t: 'action', id, action: b.action });
  };
  if (b.confirm) ask(`${b.label || 'Run this'}?`, run); else run();
}
function ask(title, yes) {
  $('cTitle').textContent = title; $('confirm').classList.add('show');
  $('cNo').onclick = () => $('confirm').classList.remove('show');
  $('cYes').onclick = () => { $('confirm').classList.remove('show'); yes(); };
}

function setLayout(l, cache) {
  layout = l;
  if (cache !== false) try { localStorage.setItem('layout', JSON.stringify(l)); } catch (e) {}
  render();
}
function onMsg(m) {
  if (m.id && pending[m.id]) { const f = pending[m.id]; delete pending[m.id]; f(m); return; }
  switch (m.t) {
    case 'media': med = m.none ? m : { ...m, at: Date.now() }; lyricTick(); break;
    case 'lyrics': lyr = { key: m.key, lines: m.lines || [] }; lyricTick(); break;
    case 'auth_ok': fails = 0; setConn('on'); resetSubs(); if (m.hosts) native('hosts:' + JSON.stringify(m.hosts)); send({ t: 'layout_get', id: 0 }); break;
    case 'auth_fail': native('unpaired'); break;
    case 'status': status = m; refreshActive(); refreshWidgets(); refreshSliders(); break;
    case 'obs': obs = m; renderObs(); refreshActive(); break;
    case 'game': game = m; renderGame(); break;
    case 'pad': padState = m; renderPad(); break;
    case 'fg': fgApp = m.app || ''; autoAppPage(); break;
    case 'discord': if (m.inCall !== discord.inCall) dView = null; if (m.rpc !== 'ok') dGuilds = null; discord = m; renderDiscord(); refreshActive(); autoDiscordPage(); break;
    case 'layout': setLayout(m.layout); break;
  }
}
function connect() {
  clearTimeout(retry); setConn('mid');
  try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); } catch (e) { return later(); }
  ws.onopen = () => ws.send(JSON.stringify({ t: 'auth', deviceId: DEV, token: TOK }));
  ws.onmessage = e => { if (typeof e.data !== 'string') { onFrame(e.data); return; } try { onMsg(JSON.parse(e.data)); } catch (x) {} };
  ws.onclose = () => { setConn('off'); subMedia = false; subScreen = false; later(); };
  ws.onerror = () => {};
}
function later() { fails++; if (fails >= 6) { native('offline'); fails = 3; } retry = setTimeout(connect, 1500); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && !connected) { fails = 0; connect(); } });

$('gear').onclick = () => {
  const box = $('profiles'); box.innerHTML = '';
  if (layout) layout.profiles.forEach(p => {
    const b = document.createElement('button'); b.textContent = (p.id === (profile() || {}).id ? '✓  ' : '     ') + p.name;
    b.onclick = () => { profileId = p.id; localStorage.setItem('profile', p.id); curPage = 0; $('menu').classList.remove('show'); render(); };
    box.appendChild(b);
  });
  $('menu').classList.add('show');
};
$('mClose').onclick = () => $('menu').classList.remove('show');
$('mReconnect').onclick = () => { $('menu').classList.remove('show'); try { ws.close(); } catch (e) {} fails = 0; connect(); };
$('mReload').onclick = () => { $('menu').classList.remove('show'); send({ t: 'layout_get', id: 0 }); };
$('mSettings').onclick = () => { $('menu').classList.remove('show'); native('settings'); };

/** Preview mode: the PC editor sends the layout (and which page is open); sample data fills the live tiles and widget pages. */
function startPreview() {
  document.body.classList.add('preview');
  connected = true;
  status = { netDown: 13002342, netUp: 1887436, netTotDown: 3435973836, netTotUp: 429496729, cpu: 37, ram: 52, uptime: 93784, volume: 70, brightness: 80, muted: false, micMuted: false, disks: { C: { free: 512, total: 953 }, D: { free: 300, total: 931 }, E: { free: 120, total: 476 } } };
  discord = { rpc: 'ok', status: '', inCall: true, channel: 'General', mute: false, deaf: false, users: [{ id: '1', name: 'You', avatar: '', mute: false, deaf: false, speaking: true }, { id: '2', name: 'Alex', avatar: '', mute: true, deaf: false, speaking: false }, { id: '3', name: 'Sam', avatar: '', mute: false, deaf: false, speaking: false }] };
  obs = { rpc: 'ok', status: '', scene: 'Gameplay', scenes: ['Starting Soon', 'Gameplay', 'Chatting'], streaming: false, recording: false, paused: false, vcam: false, streamTime: '', recTime: '', studio: false, preview: '', replay: false, itemsScene: 'Gameplay', items: [{ id: 1, name: 'Overlay', enabled: true, locked: true, group: false }, { id: 2, name: 'Webcam', enabled: true, locked: false, group: false }, { id: 3, name: 'Game Capture', enabled: true, locked: false, group: false }], transitions: ['Cut', 'Fade', 'Slide'], transition: 'Fade', transitionMs: 300, inputs: [{ name: 'Mic/Aux', mute: false, vol: 0.8 }, { name: 'Desktop Audio', mute: false, vol: 0.5 }] };
  window.addEventListener('message', e => {
    const m = e.data; if (!m || m.sd !== 'preview') return;
    if (m.layout) layout = m.layout;
    if (m.profile) profileId = m.profile;
    folderId = m.folder || null;
    if (typeof m.page === 'number') curPage = m.page;

  try { parent.postMessage({ sd: 'preview-ready' }, '*'); } catch (x) {}
}

(async function boot() {
  try { icons = await (await fetch('/assets/icons.json')).json(); } catch (e) {}
  try { await document.fonts.load('24px MI'); } catch (e) {}
  if (icons.settings) $('gear').textContent = String.fromCodePoint(icons.settings);
  if (PREVIEW) { startPreview(); return; }
  try { const c = localStorage.getItem('layout'); if (c) setLayout(JSON.parse(c), false); } catch (e) {}
  if (!layout) render();

})();
