<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>StreamDeck</title>
<link rel="stylesheet" href="/assets/bg.css">
<script src="/assets/bg.js"></script>
<style>
  @font-face { font-family: MI; src: url(/assets/MaterialIcons.otf); }
  :root { --gap:5px; --radius:14px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:#000; color:#fff; font-family:system-ui,Roboto,sans-serif; overflow:hidden; touch-action:manipulation; }
  body { position:fixed; inset:0; background-size:cover; background-position:center; }
  body.neon { --gap:10px; --radius:20px; background-color:#05050f; }
  #pages { position:absolute; z-index:1; inset:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior:contain; }
  #pages::-webkit-scrollbar { display:none; }
  .page { flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; display:grid; gap:var(--gap); padding:var(--gap); min-height:0; }
  /* ---------- keys: flat style (default) ---------- */
  .key { container-type:size; position:relative; min-width:0; min-height:0; border-radius:var(--radius); overflow:hidden;
         background:var(--fill,rgba(0,0,0,.55)); border:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3cqmin;
         transition:transform .08s, filter .2s; }
  .key.down { transform:scale(.93); }
  .key.empty { background:rgba(0,0,0,.25); border:1px solid #ffffff12; pointer-events:none; }
  .key .ic { font-family:MI; font-size:44cqmin; line-height:1; color:var(--ic,#fff); }
  .key .ic.txt { font-family:system-ui,'Segoe UI Emoji',sans-serif; font-weight:800; font-size:38cqmin; }
  .key img { width:50cqmin; height:50cqmin; object-fit:cover; border-radius:18%; }
  .key .lb { font-size:max(10px,11.5cqmin); font-weight:700; text-align:center; padding:0 4px; line-height:1.05; max-width:100%; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; text-shadow:0 1px 2px #000; }
  .key .val { font-size:max(14px,24cqmin); font-weight:800; line-height:1; color:var(--ic,#fff); font-variant-numeric:tabular-nums; }
  .key .val small { font-size:.55em; font-weight:700; }
  .key .bar { width:70%; height:max(4px,6cqmin); border-radius:4px; background:#ffffff26; overflow:hidden; }
  .key .bar i { display:block; height:100%; background:var(--ic,#22e58b); transition:width .4s; }
  .key.off { filter:saturate(.35) brightness(.7); }
  .key.act { box-shadow:inset 0 0 0 2px var(--ic,#fff), 0 0 14px var(--ic,#fff); }
  .key.busy::after { content:''; position:absolute; inset:0; background:#ffffff30; animation:p .45s forwards; }
  @keyframes p { from{opacity:1} to{opacity:0} }
  /* ---------- neon style ---------- */
  body.neon .key { border:0; background:linear-gradient(180deg,var(--t1),#080818); box-shadow:0 0 var(--gl) var(--ga); overflow:visible; }
  /* icon-only keys: no outline, icon fills the key */
  .key.nolabel .ic { font-size:62cqmin; }
  .key.nolabel .ic.txt { font-size:54cqmin; }
  .key.nolabel img { width:72cqmin; height:72cqmin; }
  /* ---------- widget pages ---------- */
  .page.wpage { display:flex; align-items:center; justify-content:center; position:relative; padding:0; overflow:hidden; }
  .edge { position:absolute; top:0; bottom:0; width:26px; z-index:3; } .edge.l { left:0; } .edge.r { right:0; }
  .clockw { text-align:center; line-height:1; }
  .clockw .t { font-size:min(26vw,40vh); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; text-shadow:0 0 30px #000a; }
  .clockw .d { font-size:min(5vw,7vh); opacity:.8; margin-top:2vh; }
  .clockw svg { width:min(80vw,80vh); height:min(80vw,80vh); }
  .lyw { width:100%; height:100%; display:flex; flex-direction:column; padding:14px 22px; }
  .lyw .h { flex:0 0 auto; text-align:center; opacity:.8; font-size:14px; margin-bottom:6px; text-shadow:0 1px 3px #000; }
  .lyw .h b { display:block; font-size:18px; opacity:1; }
  .lyw .L { flex:1; overflow:hidden; position:relative; -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent); mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent); }
  .lyw .L > div { position:absolute; left:0; right:0; transition:transform .45s ease; }
  .lyw p { margin:0; padding:7px 0; text-align:center; font-size:clamp(18px,4.4vw,34px); font-weight:700; opacity:.38; transition:opacity .3s, transform .3s; text-shadow:0 1px 4px #000; }
  .lyw p.on { opacity:1; transform:scale(1.07); }
  .lyw .none { margin:auto; opacity:.7; text-align:center; padding:20px; }
  .ytw, .scrw { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .scrw { object-fit:contain; touch-action:none; }
  .wmsg { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; opacity:.75; padding:20px; pointer-events:none; text-shadow:0 1px 3px #000; }
  body.neon .key .ic { color:color-mix(in srgb,var(--c1) 65%,white); text-shadow:0 0 14px var(--c1); }
  /* ---------- overlays (no bars: keys fill the screen) ---------- */
  #gear { position:fixed; top:calc(6px + env(safe-area-inset-top)); right:calc(6px + env(safe-area-inset-right)); width:30px; height:30px; border-radius:50%; background:#000000aa; display:grid; place-items:center; font:20px MI; opacity:.4; z-index:5; }
  #dot { position:fixed; top:calc(2px + env(safe-area-inset-top)); right:calc(2px + env(safe-area-inset-right)); width:9px; height:9px; border-radius:50%; background:#ff5252; z-index:6; pointer-events:none; }
  #dot.on { background:#22e58b; } #dot.mid { background:#ffc400; }
  #dots { position:fixed; left:50%; bottom:6px; transform:translateX(-50%); display:flex; gap:7px; padding:5px 9px; border-radius:12px; background:#000000a0; opacity:0; transition:opacity .3s; pointer-events:none; z-index:5; }
  #dots.show { opacity:1; } #dots i { width:7px; height:7px; border-radius:50%; background:#ffffff40; display:block; } #dots i.on { background:#fff; }
  #banner { position:fixed; left:0; right:0; top:0; padding:6px; text-align:center; font-size:13px; background:#b71c1ccc; display:none; z-index:7; }
  #banner.show { display:block; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#8e1b2e; color:#fff; padding:10px 16px; border-radius:14px; font-size:14px; max-width:86vw; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  #toast.show { opacity:1; } #toast.ok { background:#16163a; }
  .modal { position:fixed; inset:0; background:#000000b8; display:none; align-items:center; justify-content:center; z-index:30; }
  .modal.show { display:flex; }
  .card { background:#101018; border:1px solid #ffffff30; border-radius:18px; padding:18px; min-width:260px; max-width:86vw; max-height:86vh; overflow:auto; }
  .card h3 { margin:0 0 12px; font-size:17px; }
  .card button { font:inherit; color:#fff; background:#1c1c2c; border:1px solid #ffffff22; border-radius:12px; padding:11px 14px; margin:4px 0; width:100%; text-align:left; }
  .card button.pri { background:#7c4dff; border-color:#7c4dff; }
  .row { display:flex; gap:8px; } .row button { text-align:center; }
  .key.slider { cursor:pointer; }
  .key.slider .fill { position:absolute; left:0; bottom:0; width:100%; height:0; opacity:.6; transition:height .1s, width .1s; }
  .key.slider .ic, .key.slider .sval, .key.slider .lb { position:relative; z-index:1; }
  .key .sval { font-size:max(14px,18cqmin); font-weight:800; line-height:1; }
  .dcw { position:absolute; inset:0; display:flex; flex-direction:column; padding:calc(14px + env(safe-area-inset-top)) 14px 14px; gap:12px; background:rgba(0,0,0,.35); }
  .dcw .dh { display:flex; align-items:baseline; gap:10px; } .dcw .dh b { font-size:22px; } .dcw .dh span { opacity:.75; font-size:14px; }
  .dusers { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:12px; align-content:start; }
  .du { text-align:center; position:relative; } .du img { width:100%; aspect-ratio:1; border-radius:50%; object-fit:cover; background:#202225; border:3px solid transparent; transition:box-shadow .12s,border-color .12s; }
  .du.noimg::before { content:attr(data-l); position:absolute; left:0; right:0; top:0; aspect-ratio:1; border-radius:50%; background:#5865f2; display:grid; place-items:center; font-size:34px; font-weight:700; z-index:0; }
  .du.noimg.speaking::before { box-shadow:0 0 0 3px #23a55966, 0 0 18px #23a559; border:3px solid #23a559; box-sizing:border-box; }
  .du.speaking img { border-color:#23a559; box-shadow:0 0 0 3px #23a55966, 0 0 18px #23a559; } .du.muted img { opacity:.55; }
  .du .dn { margin-top:6px; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .du .db { position:absolute; top:0; right:8px; font-size:15px; text-shadow:0 1px 3px #000; }
  .dbtns { display:flex; gap:10px; } .dbtns button { flex:1; font:inherit; font-weight:700; color:#fff; background:#2b2d31; border:2px solid #5865f2; border-radius:16px; padding:18px 6px; font-size:16px; }
  .dbtns button.on { background:#ed4245; border-color:#ed4245; } .dbtns button.leave { border-color:#ed4245; color:#ff7a7c; } .dbtns button i { display:none; }
  .dh .dsv { margin-left:auto; font:inherit; font-size:13px; font-weight:600; color:#fff; background:#2b2d31; border:1px solid #5865f2; border-radius:12px; padding:6px 12px; }
  .dview { flex:1; min-height:0; display:none; flex-direction:column; gap:12px; }
  .dcw[data-v=call] .dcall, .dcw[data-v=servers] .dsrv, .dcw[data-v=channels] .dchn { display:flex; }
  .dmsg { opacity:.75; font-size:14px; }
  .dgrid { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:14px; align-content:start; }
  .gt { text-align:center; position:relative; } .gt img { width:100%; aspect-ratio:1; border-radius:28%; object-fit:cover; background:#202225; display:block; }
  .gt.noimg::before { content:attr(data-l); display:grid; place-items:center; width:100%; aspect-ratio:1; border-radius:28%; background:#5865f2; font-size:34px; font-weight:700; }
  .gt .gn { margin-top:6px; font-size:12.5px; font-weight:600; line-height:1.15; max-height:2.4em; overflow:hidden; }
  .dback { align-self:flex-start; font-size:15px; font-weight:700; color:#8ea1ff; padding:6px 2px; }
  .dlist { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .dc { background:#2b2d31; border:1px solid #ffffff22; border-radius:14px; padding:16px; font-size:16px; font-weight:600; }
  .dc:active { background:#5865f2; }
  .obw { position:absolute; inset:0; overflow:auto; display:flex; flex-direction:column; gap:10px; padding:calc(14px + env(safe-area-inset-top)) 14px 14px; background:rgba(0,0,0,.35); }
  .obw .oh { display:flex; align-items:baseline; gap:10px; } .obw .oh b { font-size:22px; } .obw .oh span { opacity:.75; font-size:14px; }
  .obw.off .obtns, .obw.off .osc, .obw.off .omx, .obw.off .osec { opacity:.35; pointer-events:none; }
  .obtns { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
  .obtns button { font:inherit; color:#fff; background:#26262f; border:2px solid #ffffff2a; border-radius:16px; padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; } .obtns button b { font-size:16px; } .obtns small { font-size:13px; opacity:.85; min-height:1em; font-variant-numeric:tabular-nums; }
  .obtns .b-live.on { background:#d6264a; border-color:#ff5c7c; } .obtns .b-rec.on { background:#c0392b; border-color:#ff7b6e; } .obtns .b-vcam.on { background:#1f7a4d; border-color:#37d67a; } .obtns .b-pause { border-color:#ffc400; }
  .osec { font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.6; margin-top:4px; }
  .osc { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  .sc { background:#26262f; border:2px solid #ffffff22; border-radius:14px; padding:16px 8px; text-align:center; font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .sc.cur { border-color:#37d67a; background:#173d2b; box-shadow:0 0 14px #37d67a55; }
  .omx { display:flex; flex-direction:column; gap:8px; }
  .mx { display:flex; align-items:center; gap:10px; background:#1c1c24; border-radius:14px; padding:8px 10px; } .mx.muted { opacity:.55; }
  .mx .mm { font-size:20px; background:none; border:0; color:#fff; padding:4px 6px; } .mx .mn { width:34%; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mx .mt { flex:1; height:26px; border-radius:13px; background:#ffffff22; overflow:hidden; touch-action:none; } .mx .mt i { display:block; height:100%; width:0; background:linear-gradient(90deg,#37d67a,#7bf1a8); }
  .mx .mv { width:2.4em; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; opacity:.85; }
  #empty { margin:auto; text-align:center; color:#aaa; padding:30px; }
</style>
</head>
<body>
<div id="bg" style="position:fixed;inset:0;z-index:0"></div>
<div id="pages"></div>
<div id="banner">Offline – reconnecting…</div>
<span id="dot"></span><div id="gear">⚙</div><div id="dots"></div>
<div id="toast"></div>
<div class="modal" id="confirm"><div class="card"><h3 id="cTitle"></h3><div class="row"><button id="cNo">Cancel</button><button id="cYes" class="pri">Run</button></div></div></div>
<div class="modal" id="menu"><div class="card"><h3>StreamDeck</h3><div id="profiles"></div><button id="mReconnect">Reconnect</button><button id="mReload">Reload layout</button><button id="mSettings">Phone settings / pairing</button><button id="mClose">Close</button></div></div>

<script>
'use strict';
const H = new URLSearchParams(location.hash.slice(1));
const DEV = H.get('d') || '', TOK = H.get('t') || '';
const $ = id => document.getElementById(id);
const native = m => { try { Native.postMessage(m); } catch (e) {} };
let folderId = null, lastBg = null, icons = {}, layout = null, ws = null, status = {}, fails = 0, connected = false, nextId = 1, pending = {}, retry = null, dotsT = null;
let profileId = localStorage.getItem('profile') || null, curPage = 0;

const hexToRgba = (h, a) => { const n = parseInt(h.replace('#', ''), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
function toast(msg, ok) { const t = $('toast'); t.textContent = msg; t.className = 'show' + (ok ? ' ok' : ''); clearTimeout(toast.h); toast.h = setTimeout(() => t.className = '', ok ? 1400 : 3500); }
const profile = () => layout && (layout.profiles.find(p => p.id === profileId) || layout.profiles.find(p => p.id === layout.activeProfile) || layout.profiles[0]);

function setConn(state) {
  connected = state === 'on';
  $('dot').className = state === 'on' ? 'on' : state === 'mid' ? 'mid' : '';
  $('banner').classList.toggle('show', state === 'off' && !!layout);
  document.querySelectorAll('.key:not(.empty)').forEach(k => k.classList.toggle('off', !connected));
}

// ---- live tiles -------------------------------------------------------------------------------
function fmtWidget(w) {
  const s = status, pct = v => (v == null ? null : Math.max(0, Math.min(100, v)));
  if (w === 'clock') { const d = new Date(); return { v: d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }; }
  if (!connected) return { v: '—' };
  if (w === 'cpu') return { v: `${s.cpu ?? 0}<small>%</small>`, bar: pct(s.cpu) };
  if (w === 'ram') return { v: `${s.ram ?? 0}<small>%</small>`, bar: pct(s.ram) };
  if (w === 'volume') return { v: `${s.volume ?? 0}<small>%</small>`, bar: pct(s.volume) };
  if (w === 'brightness') return s.brightness < 0 ? { v: 'n/a' } : { v: `${s.brightness}<small>%</small>`, bar: pct(s.brightness) };
  if (w === 'uptime') { const t = s.uptime || 0, d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60); return { v: (d ? d + 'd ' : '') + `${h}:${String(m).padStart(2, '0')}` }; }
  if (w.startsWith('disk:')) { const dk = (s.disks || {})[w.slice(5)]; return dk ? { v: `${dk.free}<small> GB free</small>`, bar: pct(100 - dk.free * 100 / dk.total) } : { v: 'n/a' }; }
  return { v: '' };
}
function refreshWidgets() {
  document.querySelectorAll('.key[data-w]').forEach(k => { const r = fmtWidget(k.dataset.w); k.querySelector('.val').innerHTML = r.v; const b = k.querySelector('.bar i'); if (b) b.style.width = (r.bar ?? 0) + '%'; k.querySelector('.bar').style.display = r.bar == null ? 'none' : ''; });
}
setInterval(() => { if (document.querySelector('.key[data-w="clock"]')) refreshWidgets(); }, 10000);

// ---- rendering --------------------------------------------------------------------------------
function render() {
  const p = profile(), host = $('pages'), dots = $('dots');
  document.body.classList.toggle('neon', !!layout && layout.style === 'neon');
  const bgKey = JSON.stringify((layout && layout.background) || null);
  if (bgKey !== lastBg) { lastBg = bgKey; applyBg($('bg'), layout && layout.background, layout && layout.bgDim); } else setBgDim($('bg'), layout && layout.bgDim);
  host.innerHTML = ''; dots.innerHTML = '';
  if (!p) { host.innerHTML = '<div id="empty">Waiting for the layout from your PC…</div>'; return; }
  // Folder pages are hidden from the swipe pager and only open from a folder key.
  let shown = folderId ? p.pages.filter(x => x.id === folderId) : p.pages.filter(x => !x.hidden);
  if (!shown.length) { folderId = null; shown = p.pages.filter(x => !x.hidden); if (!shown.length) shown = p.pages; }
  shownPages = shown;
  shown.forEach(pg => {
    if (pg.kind) { const w = widgetPage(pg); host.appendChild(w); dots.appendChild(document.createElement('i')); return; }
    const el = document.createElement('div'); el.className = 'page';
    el.style.gridTemplateColumns = `repeat(${pg.cols},minmax(0,1fr))`; el.style.gridTemplateRows = `repeat(${pg.rows},minmax(0,1fr))`;
    const covered = new Set();
    pg.slots.forEach((b, i) => {
      if (!b) return; const cs = b.colSpan || 1, rs = b.rowSpan || 1; if (cs < 2 && rs < 2) return;
      const c = i % pg.cols, r = Math.floor(i / pg.cols);
      for (let dr = 0; dr < rs; dr++) for (let dc = 0; dc < cs; dc++) if ((dr || dc) && c + dc < pg.cols && r + dr < pg.rows) covered.add((r + dr) * pg.cols + c + dc);
    });
    pg.slots.forEach((b, i) => {
      if (covered.has(i)) return;
      const n = b ? keyEl(b) : Object.assign(document.createElement('div'), { className: 'key empty' });
      const c = i % pg.cols, r = Math.floor(i / pg.cols);
      n.style.gridColumn = `${c + 1} / span ${Math.max(1, Math.min(b ? b.colSpan || 1 : 1, pg.cols - c))}`;
      n.style.gridRow = `${r + 1} / span ${Math.max(1, Math.min(b ? b.rowSpan || 1 : 1, pg.rows - r))}`;
      el.appendChild(n);
    });
    host.appendChild(el); dots.appendChild(document.createElement('i'));
  });
  dots.style.display = shown.length > 1 ? 'flex' : 'none';
  curPage = Math.min(curPage, shown.length - 1);
  host.scrollTo({ left: curPage * host.clientWidth });
  markDots(); refreshActive(); refreshWidgets(); refreshSliders(); setConn(connected ? 'on' : 'off'); activate(); renderDiscord(); autoDiscordPage();
}

// ---- widget pages: clock, lyrics, YouTube, PC screen -------------------------------------------------
let obs = { rpc: 'off', status: '', scene: '', scenes: [], streaming: false, recording: false, paused: false, vcam: false, streamTime: '', recTime: '', inputs: [] };
let discord = { rpc: 'off', status: '', inCall: false, channel: '', users: [], mute: false, deaf: false }, autoOpened = false, dismissedCall = false, prevPage = 0;
let shownPages = [], subMedia = false, subScreen = false, med = null, lyr = { key: '', lines: [] }, lyIdx = -1, frameUrl = null;
const curKind = () => { const p = shownPages[curPage]; return p && p.kind; };
function sub(type, on) { send({ t: type, on }); }
function activate() {
  const k = curKind();
  const wantMedia = k === 'lyrics', wantScreen = k === 'screen';
  if (connected) {
    if (wantMedia !== subMedia) { subMedia = wantMedia; sub('media_sub', wantMedia); }
    if (wantScreen !== subScreen) { subScreen = wantScreen; sub('screen_sub', wantScreen); }
  }
  document.querySelectorAll('iframe.ytw').forEach(f => { const on = k === 'youtube' && f.closest('.wpage') === $('pages').children[curPage]; const want = on ? f.dataset.src : 'about:blank'; if (f.getAttribute('src') !== want) f.setAttribute('src', want); });
}
function resetSubs() { subMedia = false; subScreen = false; activate(); }
function mkPage(extra) { const el = document.createElement('div'); el.className = 'page wpage'; el.dataset.kind = extra; ['l', 'r'].forEach(s => { const e = document.createElement('div'); e.className = 'edge ' + s; el.append(e); }); return el; }
function widgetPage(pg) {
  const el = mkPage(pg.kind);
  if (pg.kind === 'clock') {
    const w = document.createElement('div'); w.className = 'clockw'; el.append(w);
    const draw = () => {
      if (!w.isConnected) return; const d = new Date();
      if (pg.style === 'analog') {

  const upd = e => {
    const r = k.getBoundingClientRect(), vertical = k.clientHeight >= k.clientWidth;
    let v = vertical ? 1 - (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    pct = Math.round(Math.max(0, Math.min(1, v)) * 100); paintSlider(k, pct);
    const now = Date.now(); if (now - lastSend > 120) { lastSend = now; send1(pct); }
  };
  k.addEventListener('pointerdown', e => { if (!connected) { toast('Not connected to the PC'); return; } dragging = true; k._drag = true; try { k.setPointerCapture(e.pointerId); } catch (x) {} native('h'); upd(e); });
  k.addEventListener('pointermove', e => { if (dragging) upd(e); });
  const end = () => { if (!dragging) return; dragging = false; send1(pct); setTimeout(() => { k._drag = false; }, 800); };
  k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
  k._slider = sd; paintSlider(k, null);
}
function refreshSliders() {
  document.querySelectorAll('.key.slider').forEach(k => { if (k._drag || !connected) return; paintSlider(k, k._slider.get(status)); });
}

function refreshActive() {
  document.querySelectorAll('.key').forEach(k => {
    const t = k._b && k._b.action && k._b.action.type;
    k.classList.toggle('act', (t === 'mute_toggle' && status.muted === true) || (t === 'mic_toggle' && status.micMuted === true) || (t === 'discord_mute_toggle' && discord.mute) || (t === 'discord_deafen_toggle' && discord.deaf) || (t === 'obs_stream_toggle' && obs.streaming) || (t === 'obs_record_toggle' && obs.recording) || (t === 'obs_virtualcam_toggle' && obs.vcam) || (t === 'obs_scene' && obs.scene && k._b.action.scene === obs.scene) || (t === 'obs_mute_toggle' && (obs.inputs.find(i => i.name === k._b.action.input) || {}).mute === true));
  });
}
function markDots() { [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === curPage)); }
$('pages').addEventListener('scroll', () => {
  const h = $('pages'); const i = Math.round(h.scrollLeft / Math.max(1, h.clientWidth));
  if (i !== curPage) { curPage = i; if (autoOpened && shownPages[i] && shownPages[i].kind !== 'discord') { autoOpened = false; dismissedCall = true; } markDots(); activate(); const d = $('dots'); d.classList.add('show'); clearTimeout(dotsT); dotsT = setTimeout(() => d.classList.remove('show'), 1200); }
}, { passive: true });

const send = o => { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; };

function press(k, b) {
  native('h');
  const at = b.action && b.action.type;
  if (at === 'folder') { folderId = b.action.pageId || null; curPage = 0; render(); return; }
  if (at === 'back') { folderId = null; curPage = 0; render(); return; }
  if (!b.action || b.action.type === 'none') return;
  if (!connected) { toast('Not connected to the PC'); return; }
  const run = () => {
    const id = nextId++;
    k.classList.add('busy'); setTimeout(() => k.classList.remove('busy'), 450);
    pending[id] = r => { if (!r.ok) toast(r.error || 'Failed'); else if (r.message) toast(r.message, true); };
    send({ t: 'action', id, action: b.action });
  };
  if (b.confirm) ask(`${b.label || 'Run this'}?`, run); else run();
}
function ask(title, yes) {
  $('cTitle').textContent = title; $('confirm').classList.add('show');
  $('cNo').onclick = () => $('confirm').classList.remove('show');
  $('cYes').onclick = () => { $('confirm').classList.remove('show'); yes(); };
}

function setLayout(l, cache) {
  layout = l;
  if (cache !== false) try { localStorage.setItem('layout', JSON.stringify(l)); } catch (e) {}
  render();
}
function onMsg(m) {
  if (m.id && pending[m.id]) { const f = pending[m.id]; delete pending[m.id]; f(m); return; }
  switch (m.t) {
    case 'media': med = m.none ? m : { ...m, at: Date.now() }; lyricTick(); break;
    case 'lyrics': lyr = { key: m.key, lines: m.lines || [] }; lyricTick(); break;
    case 'auth_ok': fails = 0; setConn('on'); resetSubs(); if (m.hosts) native('hosts:' + JSON.stringify(m.hosts)); send({ t: 'layout_get', id: 0 }); break;
    case 'auth_fail': native('unpaired'); break;
    case 'status': status = m; refreshActive(); refreshWidgets(); refreshSliders(); break;
    case 'obs': obs = m; renderObs(); refreshActive(); break;
    case 'discord': if (m.inCall !== discord.inCall) dView = null; if (m.rpc !== 'ok') dGuilds = null; discord = m; renderDiscord(); refreshActive(); autoDiscordPage(); break;
    case 'layout': setLayout(m.layout); break;
  }
}
function connect() {
  clearTimeout(retry); setConn('mid');
  try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); } catch (e) { return later(); }
  ws.onopen = () => ws.send(JSON.stringify({ t: 'auth', deviceId: DEV, token: TOK }));
  ws.onmessage = e => { if (typeof e.data !== 'string') { onFrame(e.data); return; } try { onMsg(JSON.parse(e.data)); } catch (x) {} };
  ws.onclose = () => { setConn('off'); subMedia = false; subScreen = false; later(); };
  ws.onerror = () => {};
}
function later() { fails++; if (fails >= 6) { native('offline'); fails = 3; } retry = setTimeout(connect, 1500); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && !connected) { fails = 0; connect(); } });

$('gear').onclick = () => {
  const box = $('profiles'); box.innerHTML = '';
  if (layout) layout.profiles.forEach(p => {
    const b = document.createElement('button'); b.textContent = (p.id === (profile() || {}).id ? '✓  ' : '     ') + p.name;
    b.onclick = () => { profileId = p.id; localStorage.setItem('profile', p.id); curPage = 0; $('menu').classList.remove('show'); render(); };
    box.appendChild(b);
  });
  $('menu').classList.add('show');
};
$('mClose').onclick = () => $('menu').classList.remove('show');
$('mReconnect').onclick = () => { $('menu').classList.remove('show'); try { ws.close(); } catch (e) {} fails = 0; connect(); };
$('mReload').onclick = () => { $('menu').classList.remove('show'); send({ t: 'layout_get', id: 0 }); };
$('mSettings').onclick = () => { $('menu').classList.remove('show'); native('settings'); };

(async function boot() {
  try { icons = await (await fetch('/assets/icons.json')).json(); } catch (e) {}
  try { await document.fonts.load('24px MI'); } catch (e) {}
  if (icons.settings) $('gear').textContent = String.fromCodePoint(icons.settings);
  try { const c = localStorage.getItem('layout'); if (c) setLayout(JSON.parse(c), false); } catch (e) {}
  if (!layout) render();
  connect();
})();
</script>
</body>
